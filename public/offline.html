<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#15803d">
    <title>غير متصل — نظام الكاشير</title>
    <style>
        :root {
            color-scheme: light;
            --green: #15803d;
            --green-soft: #dcfce7;
            --text: #14532d;
            --muted: #4b5563;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #bbf7d0 0%, transparent 45%),
                linear-gradient(160deg, #f0fdf4 0%, #ffffff 55%, #ecfdf5 100%);
            color: var(--text);
        }
        .card {
            width: 100%;
            max-width: 26rem;
            text-align: center;
        }
        img {
            width: 5.5rem;
            height: 5.5rem;
            border-radius: 1.25rem;
            margin: 0 auto 1.25rem;
            display: block;
            box-shadow: 0 10px 30px rgba(21, 128, 61, 0.18);
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            font-weight: 800;
        }
        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            line-height: 1.7;
            font-size: 0.975rem;
        }
        button {
            appearance: none;
            border: 0;
            border-radius: 0.75rem;
            background: var(--green);
            color: #fff;
            font: inherit;
            font-weight: 700;
            padding: 0.8rem 1.4rem;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .hint {
            margin-top: 1rem;
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            background: var(--green-soft);
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icons/icon-192x192.png" alt="نظام الكاشير" width="192" height="192">
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>تعذر تحميل الصفحة حالياً. تحقق من الاتصال ثم أعد المحاولة للعودة إلى النظام.</p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
        <div class="hint">وضع عدم الاتصال</div>
    </main>
</body>
</html>
